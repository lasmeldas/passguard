<svg xmlns="http://www.w3.org/2000/svg" width="780" height="498" viewBox="0 0 780 498" role="img" aria-label="passguard">
  <rect x="0.5" y="0.5" width="779" height="497" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 38H779.5" stroke="#30363d"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/><circle cx="42" cy="19" r="6" fill="#ffbd2e"/><circle cx="62" cy="19" r="6" fill="#27c93f"/>
  <text x="390.0" y="24" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#94a3b8">passguard</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13">
  <text x="24" y="64" xml:space="preserve"><tspan fill="#00ffa3" font-weight="700">$ </tspan><tspan fill="#e2e8f0">passguard check</tspan></text><text x="24" y="85" xml:space="preserve"><tspan fill="#94a3b8">Password to check (input hidden):</tspan></text><text x="24" y="106" xml:space="preserve"><tspan fill="#38bdf8">Strength : </tspan><tspan fill="#ff6b6b" font-weight="700">Very weak</tspan><tspan fill="#94a3b8"> (score 15/100)</tspan></text><text x="24" y="127" xml:space="preserve"><tspan fill="#38bdf8">Entropy  :</tspan><tspan fill="#e2e8f0"> ~12.0 bits</tspan></text><text x="24" y="148" xml:space="preserve"><tspan fill="#38bdf8">Cracking :</tspan><tspan fill="#e2e8f0"> instantly (offline, 10 billion guesses/s)</tspan></text><text x="24" y="169" xml:space="preserve"><tspan fill="#38bdf8">Issues:</tspan></text><text x="24" y="190" xml:space="preserve"><tspan fill="#e2e8f0">  - Contains a year, which is easy to guess.</tspan></text><text x="24" y="211" xml:space="preserve"><tspan fill="#e2e8f0">  - This is a very common password.</tspan></text><text x="24" y="232" xml:space="preserve"><tspan fill="#38bdf8">Suggestions:</tspan></text><text x="24" y="253" xml:space="preserve"><tspan fill="#e2e8f0">  - Try a passphrase of 4+ unrelated random words.</tspan></text><text x="24" y="274" xml:space="preserve"><tspan fill="#e2e8f0">  - Use a password manager and a unique password for every site.</tspan></text><text x="24" y="295" xml:space="preserve"><tspan fill="#e2e8f0"></tspan></text><text x="24" y="316" xml:space="preserve"><tspan fill="#00ffa3" font-weight="700">$ </tspan><tspan fill="#e2e8f0">passguard check</tspan></text><text x="24" y="337" xml:space="preserve"><tspan fill="#94a3b8">Password to check (input hidden):</tspan></text><text x="24" y="358" xml:space="preserve"><tspan fill="#38bdf8">Strength : </tspan><tspan fill="#00ffa3" font-weight="700">Very strong</tspan><tspan fill="#94a3b8"> (score 100/100)</tspan></text><text x="24" y="379" xml:space="preserve"><tspan fill="#38bdf8">Entropy  :</tspan><tspan fill="#e2e8f0"> ~131.1 bits</tspan></text><text x="24" y="400" xml:space="preserve"><tspan fill="#38bdf8">Cracking :</tspan><tspan fill="#e2e8f0"> billions of years or more (offline, 10 billion guesses/s)</tspan></text><text x="24" y="421" xml:space="preserve"><tspan fill="#e2e8f0"></tspan></text><text x="24" y="442" xml:space="preserve"><tspan fill="#00ffa3" font-weight="700">$ </tspan><tspan fill="#e2e8f0">passguard generate -l 20</tspan></text><text x="24" y="463" xml:space="preserve"><tspan fill="#e2e8f0">3G2FF=bL(rqi6w:7rF^Q</tspan></text>
  </g>
</svg>
